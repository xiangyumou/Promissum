# =============================================================================
# Production Docker Compose Configuration
# =============================================================================
# This file defines the production-ready deployment of Promissum
# For local development, use: docker compose up -d
# Then run: npm run dev (or just docker compose up for production)
# =============================================================================

services:
  # -------------------------------------------------------------------------
  # Promissum Application (with integrated encryption service)
  # -------------------------------------------------------------------------
  app:
    image: ghcr.io/xiangyumou/promissum:latest
    container_name: promissum-app
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped
    environment:
      # Application
      NODE_ENV: production
      PORT: 3000

      # Database (unified)
      DATABASE_URL: postgresql://${POSTGRES_USER:-promissum}:${POSTGRES_PASSWORD:-promissum_password}@db:5432/${POSTGRES_DB:-promissum}

      # Redis (rate limiting)
      REDIS_URL: redis://redis:6379
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_FAIL_OPEN: "${RATE_LIMIT_FAIL_OPEN:-true}"

      # Encryption (Drand)
      MOCK_DRAND: "${MOCK_DRAND:-false}"
      DRAND_CHAIN_URL: ${DRAND_CHAIN_URL:-https://api.drand.sh/52db9ba70e0cc0f6eaf7803dd07447a1f5477735fd3f661792ba94600c84e971}

      # Public variables
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_DATE_FORMAT: ${NEXT_PUBLIC_DATE_FORMAT:-yyyy-MM-dd HH:mm}
      NEXT_PUBLIC_AUTO_REFRESH_INTERVAL: ${NEXT_PUBLIC_AUTO_REFRESH_INTERVAL:-60}
      NEXT_PUBLIC_CACHE_TTL: ${NEXT_PUBLIC_CACHE_TTL:-5}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - promissum-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  # -------------------------------------------------------------------------
  # PostgreSQL Database (Unified - stores all data)
  # -------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: promissum-db
    restart: unless-stopped
    ports:
      - "5432:5432"  # Port mapping for local development access
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-promissum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-promissum_password}
      POSTGRES_DB: ${POSTGRES_DB:-promissum}
    volumes:
      - promissum_postgres_data:/var/lib/postgresql/data
    networks:
      - promissum-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-promissum} -d ${POSTGRES_DB:-promissum}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # -------------------------------------------------------------------------
  # Redis (Rate Limiting)
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: promissum-redis
    restart: unless-stopped
    ports:
      - "6379:6379"  # Port mapping for local development access
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - promissum_redis_data:/data
    networks:
      - promissum-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  promissum-network:
    driver: bridge
    name: promissum-network

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  promissum_postgres_data:
    name: promissum_postgres_data
  promissum_redis_data:
    name: promissum_redis_data
